name: Deploy 3DMan to GitHub Pages (franktest.xyz/3dman)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/3dman"
          NEXT_PUBLIC_APP_URL: "https://www.franktest.xyz/3dman"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dGVzdGluZy5jbGVyay5hY2NvdW50cy5kZXYk"
        run: |
          if [ -d "src/app/api" ]; then
            mv src/app/api src/app/_api_backup
          fi
          npm run build
          if [ -d "src/app/_api_backup" ]; then
            mv src/app/_api_backup src/app/api
          fi
          touch ./out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
